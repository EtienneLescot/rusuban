name: IndexNow

# Once GitHub Pages has published a push that changed docs/, tell Bing and the other IndexNow
# engines which pages changed (scripts/indexnow.mjs). A missed ping only means the next regular
# crawl picks the change up, so the ping never fails the run.
on:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: read
  pages: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Wait for Pages to publish this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 60); do
            status=$(gh api "repos/${{ github.repository }}/pages/builds" --jq '[.[] | select(.commit == "${{ github.sha }}")][0].status // ""')
            if [ "$status" = built ]; then exit 0; fi
            if [ "$status" = errored ]; then echo "The Pages build of this commit failed"; exit 1; fi
            sleep 10
          done
          echo "No Pages build of this commit after 10 minutes"
          exit 1
      - name: Ping IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs ${{ github.event.before }} ${{ github.sha }}
